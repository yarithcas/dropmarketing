<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mines – LuckyHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">🎰</span>
        <span class="logo-text">Lucky<span class="accent">Hub</span></span>
      </a>
      <nav class="main-nav">
        <a href="../index.html">Accueil</a>
        <a href="dice.html">Dice</a>
        <a href="mines.html" class="active">Mines</a>
        <a href="limbo.html">Limbo</a>
        <a href="crash.html">Crash</a>
        <a href="plinko.html">Plinko</a>
        <a href="coinflip.html">Coinflip</a>
      </nav>
      <div class="wallet-widget">
        <span class="coin-icon">🪙</span>
        <span data-balance>0.00</span>
        <span style="color:var(--text-dim); font-size:0.75rem;">GC</span>
        <button class="btn-claim" data-claim-btn>+1000 Gratuit</button>
      </div>
    </div>
  </header>

  <main class="container game-page">
    <div class="game-page-header">
      <h1>💣 Mines</h1>
      <a href="../index.html" class="back-link">← Retour au portail</a>
    </div>

    <div class="game-layout">
      <div class="panel control-panel">
        <div class="field">
          <label for="betAmount">Mise (GC)</label>
          <div class="bet-input-wrap">
            <input type="number" id="betAmount" value="10" min="0.01" step="0.01" />
            <button class="quick-btn" id="halfBtn">1/2</button>
            <button class="quick-btn" id="doubleBtn">x2</button>
            <button class="quick-btn" id="maxBtn">Max</button>
          </div>
        </div>

        <div class="field">
          <label for="minesCount">Nombre de mines</label>
          <select id="minesCount" class="bet-input-wrap" style="padding:10px 12px; background:var(--bg-soft); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-sm);">
            <!-- options injected by JS -->
          </select>
        </div>

        <div class="stat-row">
          <div class="stat-box">
            <label>Multiplicateur actuel</label>
            <div class="stat-value" id="currentMultiplier">1.0000x</div>
          </div>
          <div class="stat-box">
            <label>Gain potentiel</label>
            <div class="stat-value" id="potentialPayout">0.00 GC</div>
          </div>
        </div>

        <button class="btn-main" id="startBtn">Démarrer la partie</button>
        <button class="btn-secondary btn-danger" id="cashoutBtn" disabled>Encaisser</button>
      </div>

      <div class="stage">
        <div class="result-flash" id="resultFlash">+0.00 GC</div>
        <div class="mines-grid" id="minesGrid"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Jeu 100% gratuit — aucune valeur réelle, à but ludique uniquement.</div>
  </footer>

  <script src="../assets/js/wallet.js"></script>
  <script src="../assets/js/mines.js"></script>
</body>
</html>
