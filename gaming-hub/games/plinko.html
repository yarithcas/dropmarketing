<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plinko – LuckyHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">🎰</span>
        <span class="logo-text">Lucky<span class="accent">Hub</span></span>
      </a>
      <nav class="main-nav">
        <a href="../index.html">Accueil</a>
        <a href="dice.html">Dice</a>
        <a href="mines.html">Mines</a>
        <a href="limbo.html">Limbo</a>
        <a href="crash.html">Crash</a>
        <a href="plinko.html" class="active">Plinko</a>
        <a href="coinflip.html">Coinflip</a>
      </nav>
      <div class="wallet-widget">
        <span class="coin-icon">🪙</span>
        <span data-balance>0.00</span>
        <span style="color:var(--text-dim); font-size:0.75rem;">GC</span>
        <button class="btn-claim" data-claim-btn>+1000 Gratuit</button>
      </div>
    </div>
  </header>

  <main class="container game-page">
    <div class="game-page-header">
      <h1>🔴 Plinko</h1>
      <a href="../index.html" class="back-link">← Retour au portail</a>
    </div>

    <div class="game-layout">
      <div class="panel control-panel">
        <div class="field">
          <label for="betAmount">Mise (GC)</label>
          <div class="bet-input-wrap">
            <input type="number" id="betAmount" value="10" min="0.01" step="0.01" />
            <button class="quick-btn" id="halfBtn">1/2</button>
            <button class="quick-btn" id="doubleBtn">x2</button>
            <button class="quick-btn" id="maxBtn">Max</button>
          </div>
        </div>

        <div class="field">
          <label for="riskSelect">Niveau de risque</label>
          <div class="toggle-row">
            <button data-risk="low" class="active">Faible</button>
            <button data-risk="medium">Moyen</button>
            <button data-risk="high">Élevé</button>
          </div>
        </div>

        <button class="btn-main" id="dropBtn">Lâcher la bille</button>
      </div>

      <div class="stage">
        <div class="result-flash" id="resultFlash">+0.00 GC</div>
        <div class="plinko-board" id="plinkoBoard">
          <div class="plinko-buckets" id="plinkoBuckets"></div>
        </div>
        <div class="history-strip" id="historyStrip"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Jeu 100% gratuit — aucune valeur réelle, à but ludique uniquement.</div>
  </footer>

  <script src="../assets/js/wallet.js"></script>
  <script src="../assets/js/plinko.js"></script>
</body>
</html>
